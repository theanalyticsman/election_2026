<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>County Election Map</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1c1c1c; --muted:#6b6b6b; --line:#ddd; --nodata:#d9d9d9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --panel:#222; --ink:#eee; --muted:#9a9a9a; --line:#3a3a3a; --nodata:#3d3d3d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 12px 0 0; }
  .grp { display:flex; flex-direction:column; gap:2px; }
  .grp label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  select, button { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
  .seg button { border-radius:0; margin-left:-1px; }
  .seg button:first-child { border-radius:6px 0 0 6px; margin-left:0; }
  .seg button:last-child { border-radius:0 6px 6px 0; }
  .seg button.on { background:#2b5cab; color:#fff; border-color:#2b5cab; }
  main { position:relative; padding:8px 16px 16px; }
  svg { width:100%; height:auto; display:block; max-height:calc(100vh - 150px); }
  :root { --cline:rgba(0,0,0,.3); }
  @media (prefers-color-scheme: dark) { :root { --cline:rgba(255,255,255,.35); } }
  svg { cursor:grab; touch-action:none; } svg:active { cursor:grabbing; }
  path.county, path.state { vector-effect:non-scaling-stroke; }
  path.county { stroke:var(--cline); stroke-width:.4px; }
  path.county:hover { stroke:var(--ink); stroke-width:1.5px; }
  path.state { fill:none; stroke:var(--ink); stroke-opacity:.85; stroke-width:1.2px; stroke-linejoin:round; pointer-events:none; }
  #zoomctl { position:absolute; top:14px; right:24px; display:flex; flex-direction:column; gap:4px; }
  #zoomctl button { width:32px; height:32px; padding:0; font-size:18px; line-height:1; }
  #zoomctl button#zreset { font-size:12px; }
  #tip { position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; box-shadow:0 4px 14px rgba(0,0,0,.18); display:none; min-width:210px; z-index:5; }
  #tip b { display:block; margin-bottom:4px; }
  #tip table { width:100%; border-collapse:collapse; }
  #tip td { padding:1px 0; } #tip td:last-child { text-align:right; }
  #tip td.pct { text-align:right; font-weight:700; font-size:15px; padding:1px 10px; }
  #tip td.votes { color:var(--muted); font-size:12px; }
  #legend { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:6px; }
  #legend .bar { width:220px; height:10px; border-radius:5px; }
  .hasSel path.county:not(.sel) { opacity:.3; }
  .hasHl path.county.sel:not(.hl) { opacity:.3; }
  path.county.hl { stroke:var(--ink); stroke-width:3.5px; opacity:1; }
  path.county { cursor:pointer; }
  #panel { position:absolute; top:12px; right:66px; width:340px; max-height:calc(100% - 40px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:4; }
  #panel[hidden] { display:none; }
  #panel h2 { margin:0 24px 4px 0; font-size:16px; }
  #panel table { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0; }
  #panel th { text-align:left; font-size:11px; color:var(--muted); font-weight:600; padding:2px 4px; border-bottom:1px solid var(--line); }
  #panel td { padding:4px; border-bottom:1px solid var(--line); }
  #panel th:nth-child(n+3), #panel td:nth-child(n+3) { text-align:right; }
  #panel tbody tr:hover { background:rgba(127,127,127,.3); }
  #panel td.d { color:#4a7fd4; } #panel td.r { color:#d4574a; }
  #panel .muted { color:var(--muted); margin:4px 0; } #panel .small { font-size:11px; }
  #panel .how { margin-top:8px; font-size:12.5px; color:var(--muted); }
  #panel .how summary { cursor:pointer; font-weight:600; color:var(--ink); margin-bottom:4px; }
  #panel .how ul { margin:4px 0 6px; padding-left:18px; } #panel .how li { margin:3px 0; }
  #panel .how p { margin:6px 0; } #panel .how b { color:var(--ink); }
  #panel .how span.d { color:#4a7fd4; } #panel .how span.r { color:#d4574a; }
  #pclose { position:absolute; top:6px; right:8px; border:0; background:none; font-size:22px; line-height:1; padding:2px 6px; cursor:pointer; color:var(--muted); }
  @media (max-width: 700px) {
    #panel { position:fixed; left:8px; right:8px; top:auto; bottom:8px; width:auto; max-height:40vh; }
    #panel h2 { cursor:pointer; } #panel h2::after { content:' ▾'; color:var(--muted); font-size:13px; }
    #panel.min { max-height:none; overflow:hidden; } #panel.min h2::after { content:' ▴'; }
    #panel.min > *:not(h2):not(#pclose) { display:none; }
    header { gap:6px 10px; padding:8px 12px; align-items:center; }
    h1 { font-size:16px; margin:0 8px 0 0; }
    .grp label { display:none; }
    #mode { display:flex; overflow-x:auto; white-space:nowrap; max-width:calc(100vw - 24px); }
    #mode button { flex:none; }
    main { padding:4px 8px 8px; }
    #guide { padding:8px 12px 32px; }
  }
  #lvDlg { width:min(720px, calc(100vw - 24px)); max-height:90vh; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); padding:16px 18px; }
  #lvDlg::backdrop { background:rgba(0,0,0,.5); }
  #lvDlg h2 { margin:0 0 6px; font-size:18px; } #lvDlg .x { position:absolute; top:8px; right:12px; border:0; background:none; font-size:24px; cursor:pointer; color:var(--muted); }
  #lvDlg .row { display:flex; flex-wrap:wrap; gap:8px 14px; margin:8px 0; align-items:flex-end; }
  #lvDlg label { display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #lvDlg label.chk { flex-direction:row; align-items:center; gap:6px; text-transform:none; font-size:12px; }
  #lvDlg textarea { width:100%; font:12px/1.4 ui-monospace, Consolas, monospace; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px; }
  #lvDlg .muted { color:var(--muted); } #lvDlg .small { font-size:12px; margin:4px 0; }
  #lvDlg .un { display:flex; gap:8px; align-items:center; margin:2px 0; font-size:13px; } #lvDlg .un span { min-width:160px; }
  #lvDlg .actions { margin-top:12px; } #lvDlg button:disabled { opacity:.45; cursor:not-allowed; }
  #lvSaved a { color:#4a7fd4; }
  #panel .proj { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  #panel .proj h3 { margin:0 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #panel .proj .big { font-size:26px; font-weight:700; line-height:1.1; }
  #panel .proj input { width:52px; padding:2px 4px; }
  #panel table.mini { font-size:12px; } #panel table.mini th, #panel table.mini td { text-align:right; } #panel table.mini th:first-child, #panel table.mini td:first-child { text-align:left; }
  #guide { position:absolute; inset:0; overflow:auto; background:var(--bg); z-index:6; padding:8px 16px 32px; }
  #guide[hidden] { display:none; }
  #guide article { max-width:780px; margin:0 auto; position:relative; line-height:1.55; }
  #guide h1 { font-size:24px; margin:8px 0 4px; } #guide h2 { font-size:17px; margin:26px 0 6px; padding-top:10px; border-top:1px solid var(--line); }
  #guide .lead { color:var(--muted); font-size:15px; } #guide ul, #guide ol { padding-left:20px; } #guide li { margin:5px 0; }
  #guide table.g { width:100%; border-collapse:collapse; margin:8px 0; font-size:13.5px; }
  #guide table.g th, #guide table.g td { text-align:left; vertical-align:top; padding:7px 10px 7px 0; border-bottom:1px solid var(--line); }
  #guide table.g th { width:120px; white-space:nowrap; }
  #guide .gclose { position:absolute; top:0; right:0; border:0; background:none; font-size:26px; line-height:1; cursor:pointer; color:var(--muted); }
  .seg button:disabled { opacity:.45; cursor:not-allowed; }
  #status { margin-top:4px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>County Election Map</h1>
  <div class="grp"><label>View</label>
    <div class="seg" id="mode"><button data-m="poll" class="on" title="Polling model, and your results against it">2026</button><button data-m="result">Historical</button><button data-m="affinity">Affinity</button><button data-m="perf" title="Which counties are running ahead or behind their usual relationship to the state">Vs expected</button><button data-m="swing">Swing</button><button id="guideBtn" title="Instructions and background">Guide</button></div></div>
  <div class="grp" id="aGrp"><label id="aLabel">Election</label>
    <div style="display:flex;gap:6px"><select id="aOffice"></select><select id="aYear"></select></div></div>
  <div class="grp" id="bGrp" style="display:none"><label>Compared to (A → B)</label>
    <div style="display:flex;gap:6px"><select id="bOffice"></select><select id="bYear"></select></div></div>
  <div class="grp" style="margin-left:auto"><label>&nbsp;</label><button id="addLive" title="Paste county results as they come in">+ Add 2026 results</button></div>
  <div class="grp" id="v26Grp"><label>2026 Senate</label><div class="seg"><button id="v26model" class="on">Poll model</button><button id="v26vs">Actual vs polls</button></div></div>
  <div class="grp" id="baseGrp" style="display:none"><label>Expected from</label><select id="baseSel"><option value="counted">Counted so far</option><option value="poll">Poll average (2026 Senate)</option></select></div>
  <div class="grp" id="raceGrp" style="display:none"><label>Race type</label>
    <select id="race"><option value="regular">Regular</option><option value="special">Special</option></select></div>
</header>
<main>
  <svg id="map" viewBox="0 0 975 610" role="img" aria-label="US county election map"></svg>
  <div id="zoomctl"><button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">−</button><button id="zreset" title="Reset view">Fit</button></div>
  <aside id="panel" hidden></aside>
  <section id="guide" hidden></section>
  <div id="legend"></div>
  <div id="status">Loading…</div>
</main>
<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="live.js"></script>
<script src="app.js"></script>
<script src="guide.js"></script>
</body>
</html>
